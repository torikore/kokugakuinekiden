<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEMO 02｜ランナー｜國學院駅伝部応援情報</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
  <style>
    .demo-note {
      position: relative;
      z-index: 3;
      width: min(720px, calc(100% - 2rem));
      margin: 1.2rem auto 0;
      color: var(--muted);
      font-size: .88rem;
      letter-spacing: .04em;
    }
    .demo-note strong { color: var(--gold); font-weight: 700; }
    .runner-slot {
      position: relative;
      width: 88px;
      height: 86px;
      margin: .35rem auto .1rem;
      overflow: hidden;
    }
    .runner-slot svg {
      display: block;
      width: 88px;
      height: 86px;
    }
    .runner-slot--large {
      width: 240px;
      height: 234px;
      margin: 1.1rem auto 0;
    }
    .runner-slot--large svg {
      width: 240px;
      height: 234px;
    }
    .demo-stage {
      width: min(420px, calc(100% - 2rem));
      margin: 2rem auto 4rem;
      padding: 1.1rem 1.2rem 1.4rem;
      border: 1px solid var(--line);
      background: rgba(9, 8, 11, .72);
      text-align: center;
    }
    .stick-run .far,
    .stick-run .near { stroke-opacity: 1; }
    .stick-run .sash { fill: none; stroke: var(--aka); stroke-width: 2.2; stroke-linecap: round; }
    .demo-stage .kicker { margin-bottom: .35rem; }
  </style>
</head>
<body>
  <p class="demo-note">
    <strong>DEMO 02　棒人間の歩様</strong><br>
    静止画は使いません。左向きの側面で、脚の入れ替え・腕振り・膝のたたみ・接地と滞空を回しています。金色は体、赤紫は襷です。本番にはまだ入れていません。
  </p>

  <div class="demo-stage" style="margin-top:1.2rem">
    <p class="kicker">GAIT · LARGE</p>
    <p class="lede" style="margin-bottom:0">歩様を見るための拡大です。</p>
    <div class="runner-slot runner-slot--large" data-stick></div>
  </div>

  <section class="hero" style="min-height: auto;">
    <div class="hero__inner" style="padding-top: 2rem; padding-bottom: 2.2rem;">
      <p class="tag">DEMO 02 / COUNTDOWN SLOT</p>
      <div class="hero__meta">
        <a class="meta-block" href="https://www.izumo-ekiden.jp/" target="_blank" rel="noopener noreferrer">
          <span class="label">NEXT RACE</span>
          <strong>IZUMO 2026</strong>
          <span class="hint">公式サイト ↗</span>
        </a>
        <div class="meta-block meta-block--count">
          <span class="label">COUNTDOWN</span>
          <div id="countdown" class="countdown" aria-live="off">--</div>
          <div class="runner-slot" data-stick></div>
          <span class="hint">START 10.12 9:10 JST</span>
        </div>
      </div>
    </div>
  </section>

  <script src="../js/site.js"></script>
  <script>
    (function () {
      const SVG = (
        '<svg class="stick-run" viewBox="0 0 100 120" aria-hidden="true">' +
          '<line data-road x1="-20" y1="108" x2="120" y2="108" stroke="#e6c37a" stroke-width="1.6" stroke-dasharray="9 7" stroke-opacity=".7"/>' +
          '<ellipse data-shadow cx="52" cy="108" rx="14" ry="2.4" fill="#e6c37a" opacity=".28"/>' +
          '<g data-root>' +
            '<g data-far-arm class="far" stroke="#e6c37a" stroke-width="3.2" stroke-linecap="round">' +
              '<line data-ua x1="0" y1="0" x2="0" y2="16"/>' +
              '<g data-fa transform="translate(0,16)"><line x1="0" y1="0" x2="0" y2="14"/></g>' +
            "</g>" +
            '<g data-far-leg class="far" stroke="#e6c37a" stroke-width="3.4" stroke-linecap="round">' +
              '<line data-th x1="0" y1="0" x2="0" y2="22"/>' +
              '<g data-sh transform="translate(0,22)">' +
                '<line x1="0" y1="0" x2="0" y2="20"/>' +
                '<g data-ft transform="translate(0,20)"><line x1="0" y1="0" x2="9" y2="1.5"/></g>' +
              "</g>" +
            "</g>" +
            '<path data-sash class="sash" d="M -7 -18 Q 2 -6 11 8"/>' +
            '<g data-torso stroke="#e6c37a" stroke-width="3.6" stroke-linecap="round">' +
              '<line x1="0" y1="0" x2="0" y2="-28"/>' +
              '<circle cx="2" cy="-36" r="7.2" fill="#e6c37a" stroke="none"/>' +
              '<circle cx="8.5" cy="-35" r="2.4" fill="#e6c37a" stroke="none"/>' +
            "</g>" +
            '<g data-near-arm class="near" stroke="#e6c37a" stroke-width="3.6" stroke-linecap="round">' +
              '<line data-ua x1="0" y1="0" x2="0" y2="16"/>' +
              '<g data-fa transform="translate(0,16)"><line x1="0" y1="0" x2="0" y2="14"/></g>' +
            "</g>" +
            '<g data-near-leg class="near" stroke="#e6c37a" stroke-width="3.8" stroke-linecap="round">' +
              '<line data-th x1="0" y1="0" x2="0" y2="22"/>' +
              '<g data-sh transform="translate(0,22)">' +
                '<line x1="0" y1="0" x2="0" y2="20"/>' +
                '<g data-ft transform="translate(0,20)"><line x1="0" y1="0" x2="9" y2="1.5"/></g>' +
              "</g>" +
            "</g>" +
          "</g>" +
        "</svg>"
      );

      function limb(p) {
        var thigh = -Math.sin(p) * 50;
        var recover = Math.max(0, -Math.sin(p));
        var drive = Math.max(0, Math.sin(p));
        var knee = 8 + recover * 82 + drive * 16;
        var foot = drive * 22 - recover * 12;
        var arm = Math.sin(p) * 44;
        var elbow = 38 + drive * 28;
        return { thigh: thigh, knee: knee, foot: foot, arm: arm, elbow: elbow };
      }

      function applyLeg(g, a) {
        g.setAttribute("transform", "rotate(" + a.thigh + ")");
        g.querySelector("[data-sh]").setAttribute("transform", "translate(0,22) rotate(" + a.knee + ")");
        g.querySelector("[data-ft]").setAttribute("transform", "translate(0,20) rotate(" + a.foot + ")");
      }

      function applyArm(g, a) {
        g.setAttribute("transform", "translate(0,-22) rotate(" + a.arm + ")");
        g.querySelector("[data-fa]").setAttribute("transform", "translate(0,16) rotate(" + a.elbow + ")");
      }

      var mounts = Array.prototype.slice.call(document.querySelectorAll("[data-stick]"));
      mounts.forEach(function (el) {
        el.innerHTML = SVG;
      });

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      var STEPS = 2.45;
      var start = performance.now();

      function frame(now) {
        var t = (now - start) / 1000;
        var p = t * Math.PI * 2 * STEPS;
        var lift = Math.pow(Math.abs(Math.sin(p)), 0.9);
        var bounce = lift * 7.5;
        var lean = 14 + Math.sin(p) * 1.6;
        var near = limb(p);
        var far = limb(p + Math.PI);
        var road = (t * 110) % 16;

        mounts.forEach(function (el) {
          var svg = el.querySelector("svg");
          var root = svg.querySelector("[data-root]");
          var shadow = svg.querySelector("[data-shadow]");
          var roadEl = svg.querySelector("[data-road]");
          root.setAttribute(
            "transform",
            "translate(50," + (46 - bounce) + ") scale(-1,1) rotate(" + lean + ")"
          );
          applyLeg(svg.querySelector("[data-near-leg]"), near);
          applyLeg(svg.querySelector("[data-far-leg]"), far);
          applyArm(svg.querySelector("[data-near-arm]"), near);
          applyArm(svg.querySelector("[data-far-arm]"), far);
          var air = bounce > 4.2;
          shadow.setAttribute("cx", String(48));
          shadow.setAttribute("rx", air ? "9" : "14");
          shadow.setAttribute("opacity", air ? "0.14" : "0.3");
          roadEl.setAttribute("stroke-dashoffset", String(road));
        });
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
