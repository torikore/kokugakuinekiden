<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>國學院駅伝部応援情報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --aka: #b0175a;
      --ink: #1c1418;
      --paper: #f6f1ea;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Zen Kaku Gothic New", sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.8;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.2rem;
    }
    main { width: min(40rem, 100%); }
    p.kicker {
      letter-spacing: .22em;
      color: var(--aka);
      font-size: .8rem;
      margin-bottom: .6rem;
    }
    h1 {
      font-family: "Shippori Mincho", serif;
      font-size: clamp(1.7rem, 4vw, 2.3rem);
      margin-bottom: 1rem;
    }
    .lead { color: #5f5358; margin-bottom: 1.6rem; }
    a.btn {
      display: inline-block;
      background: var(--aka);
      color: #fff;
      text-decoration: none;
      padding: .7rem 1.2rem;
      border-radius: 999px;
    }
    a.btn:hover { filter: brightness(1.08); }
    .note {
      margin-top: 1.6rem;
      font-size: .88rem;
      color: #6a5e63;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">FAMILY ARCHIVE</p>
    <h1>國學院駅伝部応援情報</h1>
    <p class="lead">家族で閲覧するための非公式アーカイブです。ホームページの見た目はこれから選びます。いまはデザイン案を公開しています。</p>
    <a class="btn" href="samples/index.html">ホームページ案を見る</a>
    <p class="note">News / Datas / Images の本番ページは、案の決定後にこの場所へ置きます。</p>
  </main>
</body>
</html>
